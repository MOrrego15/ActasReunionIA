<!DOCTYPE html>
<html lang="es">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; }
      body { margin: 0; background: #f4f6f9; color: #172033; }
      main { max-width: 900px; margin: 40px auto; padding: 0 20px; }
      section { background: #fff; border-radius: 12px; padding: 28px;
        box-shadow: 0 8px 28px rgba(16, 42, 84, .12); }
      h1 { margin: 0 0 8px; color: #123b73; font-size: 26px; }
      .ayuda { color: #536178; margin: 0 0 22px; line-height: 1.5; }
      .acciones { display: flex; gap: 10px; margin-bottom: 18px; }
      button, a.boton { padding: 10px 14px; border: 0; border-radius: 6px;
        background: #1558a6; color: #fff; font-size: 14px; font-weight: 700;
        cursor: pointer; text-decoration: none; }
      button.secundario, a.secundario { background: #e9eff7; color: #123b73; }
      button:disabled { opacity: .55; cursor: wait; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 12px 10px; border-bottom: 1px solid #d9e1ec;
        text-align: left; vertical-align: middle; }
      th { background: #eef4fb; color: #123b73; }
      td.fecha { white-space: nowrap; }
      .seleccion { margin-top: 20px; padding: 14px; border-radius: 8px;
        background: #eef4fb; border: 1px solid #cbdcf0; }
      .seleccion code { display: block; margin: 8px 0 12px; word-break: break-all;
        font-size: 14px; }
      .campo { margin: 14px 0; }
      .campo label { display: block; margin-bottom: 6px; font-weight: 700; }
      .campo input { width: 180px; padding: 10px; border: 1px solid #9cacbf;
        border-radius: 6px; font-size: 16px; }
      .crear-acta { display: flex; align-items: center; gap: 12px;
        margin: 12px 0; }
      .aviso-secuencia { color: #536178; font-weight: 700; }
      [hidden] { display: none !important; }
      #mensaje { min-height: 22px; font-weight: 700; }
      .error { color: #a32121; } .correcto { color: #16733d; }
      @media (max-width: 680px) {
        th.nombre, td.nombre { max-width: 210px; overflow-wrap: anywhere; }
        .acciones { flex-wrap: wrap; }
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Notas de Reuniones por Meet</h1>
        <p class="ayuda">Se muestran como máximo las diez notas de reunión meet,
          más recientes encontradas en la carpeta configurada, ordenadas por
          fecha de creación en orden desendente.</p>
        <div class="acciones">
          <button id="actualizar" type="button">Actualizar lista</button>
          <a class="boton secundario" href="<?= urlAplicacion ?>"
            target="_top">Mantenimiento del correlativo</a>
        </div>
        <p id="mensaje" role="status" aria-live="polite"></p>
        <table aria-label="Últimas notas de reuniones por Meet">
          <thead><tr><th class="nombre">Nota</th><th>Fecha y hora</th>
            <th>Acción</th></tr></thead>
          <tbody id="notas"></tbody>
        </table>
        <div class="seleccion" id="seleccion" hidden>
          <strong>ID seleccionado</strong>
          <code id="idSeleccionado"></code>
          <div class="crear-acta">
            <button id="generar" type="button">Crear Acta</button>
            <span class="aviso-secuencia">Respetando la secuencia</span>
          </div>
          <div class="campo">
            <label for="correlativo">Número de secuencia</label>
            <input id="correlativo" type="number" min="1" max="999999"
              step="1" inputmode="numeric">
          </div>
          <button id="descargar" type="button" hidden>Descargar archivo</button>
        </div>
      </section>
    </main>
    <script>
      const cuerpoNotas = document.getElementById('notas');
      const mensaje = document.getElementById('mensaje');
      const actualizar = document.getElementById('actualizar');
      const seleccion = document.getElementById('seleccion');
      const idSeleccionado = document.getElementById('idSeleccionado');
      const correlativo = document.getElementById('correlativo');
      const generar = document.getElementById('generar');
      const descargar = document.getElementById('descargar');

      function formatearFecha(fechaIso) {
        return new Intl.DateTimeFormat('es-PE', {
          dateStyle: 'medium', timeStyle: 'short', timeZone: 'America/Lima'
        }).format(new Date(fechaIso));
      }

      function seleccionarId(id) {
        idSeleccionado.textContent = id;
        seleccion.hidden = false;
        correlativo.value = '';
        descargar.hidden = true;
        descargar.dataset.token = '';
        generar.disabled = true;
        mensaje.className = '';
        mensaje.textContent = 'Obteniendo número de secuencia…';
        google.script.run.withSuccessHandler(function (respuesta) {
          generar.disabled = false;
          if (!respuesta || !respuesta.exito) {
            mostrarRespuestaError(respuesta);
            return;
          }
          correlativo.value = respuesta.datos.correlativoPropuesto;
          mensaje.className = 'correcto';
          mensaje.textContent =
            'Nota seleccionada. Revisa el número de secuencia.';
        }).withFailureHandler(mostrarError).obtenerPropuestaSecuenciaNota(id);
      }

      function mostrarRespuestaError(respuesta) {
        generar.disabled = false;
        mensaje.className = 'error';
        mensaje.textContent = respuesta && respuesta.error
          ? respuesta.error.mensaje : 'La operación no pudo completarse.';
      }

      function mostrarNotas(respuesta) {
        actualizar.disabled = false;
        cuerpoNotas.replaceChildren();
        seleccion.hidden = true;
        if (!respuesta || !respuesta.exito) {
          mensaje.className = 'error';
          mensaje.textContent = respuesta && respuesta.error
            ? respuesta.error.mensaje : 'No fue posible obtener las notas.';
          return;
        }
        if (respuesta.datos.notas.length === 0) {
          mensaje.className = '';
          mensaje.textContent = 'No se encontraron notas de Gemini.';
          return;
        }
        respuesta.datos.notas.forEach(function (nota) {
          const fila = document.createElement('tr');
          const celdaNombre = document.createElement('td');
          celdaNombre.className = 'nombre';
          celdaNombre.textContent = nota.nombre;
          const celdaFecha = document.createElement('td');
          celdaFecha.className = 'fecha';
          celdaFecha.textContent = formatearFecha(nota.fechaCreacion);
          const celdaAccion = document.createElement('td');
          const boton = document.createElement('button');
          boton.type = 'button';
          boton.textContent = 'Seleccionar';
          boton.addEventListener('click', function () { seleccionarId(nota.id); });
          celdaAccion.appendChild(boton);
          fila.append(celdaNombre, celdaFecha, celdaAccion);
          cuerpoNotas.appendChild(fila);
        });
        mensaje.className = '';
        mensaje.textContent = respuesta.datos.cantidad + ' nota(s) encontrada(s).';
      }

      function mostrarError() {
        actualizar.disabled = false;
        generar.disabled = false;
        mensaje.className = 'error';
        mensaje.textContent = 'No fue posible comunicarse con el servidor.';
      }

      function cargarNotas() {
        actualizar.disabled = true;
        mensaje.className = '';
        mensaje.textContent = 'Consultando notas…';
        google.script.run.withSuccessHandler(mostrarNotas)
          .withFailureHandler(mostrarError).obtenerNotasGeminiDisponibles();
      }

      actualizar.addEventListener('click', cargarNotas);
      generar.addEventListener('click', function () {
        const valorTexto = correlativo.value.trim();
        const valor = Number(valorTexto);
        if (!/^\d+$/.test(valorTexto) || !Number.isSafeInteger(valor) ||
          valor <= 0 || valor > 999999) {
          mensaje.className = 'error';
          mensaje.textContent = 'Ingresa un número entero mayor que cero.';
          correlativo.focus();
          return;
        }
        generar.disabled = true;
        actualizar.disabled = true;
        mensaje.className = '';
        mensaje.textContent = 'Generando el acta…';
        google.script.run.withSuccessHandler(function (respuesta) {
          actualizar.disabled = false;
          if (!respuesta || !respuesta.exito) {
            generar.disabled = false;
            mostrarRespuestaError(respuesta);
            return;
          }
          generar.disabled = true;
          descargar.dataset.token = respuesta.datos.tokenDescarga;
          descargar.hidden = false;
          mensaje.className = 'correcto';
          mensaje.textContent = 'Acta generada correctamente con la secuencia ' +
            respuesta.datos.correlativo + '.';
          google.script.run.withSuccessHandler(function (propuesta) {
            if (propuesta && propuesta.exito) {
              correlativo.value = propuesta.datos.correlativoPropuesto;
            }
          }).withFailureHandler(function () {
            // La descarga confirmada prevalece sobre el fallo de propuesta.
          }).obtenerSiguienteSecuenciaActa(respuesta.datos.correlativo);
        }).withFailureHandler(function () {
          actualizar.disabled = false;
          mostrarError();
        }).generarActaNotaSeleccionada(idSeleccionado.textContent, valor);
      });
      descargar.addEventListener('click', function () {
        const token = descargar.dataset.token;
        descargar.disabled = true;
        mensaje.className = '';
        mensaje.textContent = 'Preparando descarga…';
        google.script.run.withSuccessHandler(function (respuesta) {
          descargar.disabled = false;
          if (!respuesta || !respuesta.exito) {
            mostrarRespuestaError(respuesta);
            return;
          }
          const binario = atob(respuesta.datos.contenidoBase64);
          const bytes = new Uint8Array(binario.length);
          for (let indice = 0; indice < binario.length; indice += 1) {
            bytes[indice] = binario.charCodeAt(indice);
          }
          const url = URL.createObjectURL(new Blob([bytes], {
            type: respuesta.datos.mimeType
          }));
          const enlace = document.createElement('a');
          enlace.href = url;
          enlace.download = respuesta.datos.nombre;
          document.body.appendChild(enlace);
          enlace.click();
          enlace.remove();
          URL.revokeObjectURL(url);
          descargar.hidden = true;
          mensaje.className = 'correcto';
          mensaje.textContent = 'Archivo descargado correctamente.';
        }).withFailureHandler(function () {
          descargar.disabled = false;
          mostrarError();
        }).obtenerArchivoActaParaDescarga(token);
      });
      cargarNotas();
    </script>
  </body>
</html>
